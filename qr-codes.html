<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>與自然互動 QR codes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" style="max-width: 900px; margin: 0 auto; padding: 30px 20px;">
        <header class="header" style="text-align: center; margin-bottom: 24px;">
            <h1 class="title">與自然互動 QR codes</h1>
            <p class="subtitle">掃碼後直接進入第一關並啟動指定互動</p>
        </header>

        <section class="card" style="margin-bottom: 20px;">
            <h2 style="margin-bottom: 12px;">1. 鼓勵話</h2>
            <img src="images/qr/nature-encouragement.png" alt="與自然互動 鼓勵話 QR code" style="width: 280px; max-width: 100%; display: block; margin-bottom: 10px;">
            <p style="word-break: break-all; color: #475569;">https://yilan-hero-journey-1231.vercel.app/app.html?auto=nature&type=encouragement</p>
        </section>

        <section class="card" style="margin-bottom: 20px;">
            <h2 style="margin-bottom: 12px;">2. 音樂</h2>
            <img src="images/qr/nature-music.png" alt="與自然互動 音樂 QR code" style="width: 280px; max-width: 100%; display: block; margin-bottom: 10px;">
            <p style="word-break: break-all; color: #475569;">https://yilan-hero-journey-1231.vercel.app/app.html?auto=nature&type=music</p>
        </section>

        <section class="card">
            <h2 style="margin-bottom: 12px;">3. 圖畫</h2>
            <img src="images/qr/nature-art.png" alt="與自然互動 圖畫 QR code" style="width: 280px; max-width: 100%; display: block; margin-bottom: 10px;">
            <p style="word-break: break-all; color: #475569;">https://yilan-hero-journey-1231.vercel.app/app.html?auto=nature&type=art</p>
        </section>
    </div>
</body>
</html>
